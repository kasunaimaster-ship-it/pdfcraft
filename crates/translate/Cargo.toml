[package]
name = "pdfcraft-translate"
description = "Opt-in translation review: segmenting, protected-token checks, back-translation comparison and an HTML review report"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }

# The browser build has no sockets, so it carries no HTTP client (see src/http.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring", "gzip", "platform-verifier"] }
